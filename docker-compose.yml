services:
  # ===================================================================
  # Infrastructure
  # ===================================================================

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./volumes/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
    networks:
      default:
        aliases:
          - auth.system.local
          - app.system.local

  # ===================================================================
  # Fiware
  # ===================================================================

  mongo-db:
    image: mongo:5.0
    hostname: mongo-db
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo-db
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongo-db

  orion-ld:
    image: fiware/orion-ld:1.12.0
    hostname: orion-ld
    ports:
      - "1026:1026"
    environment:
      - ORIONLD_TROE=FALSE
      - ORIONLD_MONGO_HOST=mongo-db
      - ORIONLD_MULTI_SERVICE=TRUE
    command: -logLevel DEBUG
    depends_on:
      mongo-db:
        condition: service_healthy

  # ===================================================================
  # System
  # ===================================================================

  main-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

      KEYCLOAK_DB: keycloak_db
      KEYCLOAK_USER: keycloak
      KEYCLOAK_PASSWORD: 123

      BACKEND_DB: backend_db
      BACKEND_USER: backend
      BACKEND_PASSWORD: 123
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./volumes/postgresql/init.sh:/docker-entrypoint-initdb.d/init.sh

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password123
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - main-db

  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MOSQUITTO_DYNSEC_PASSWORD: admin123456789
    volumes:
      - ./volumes/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  json-iot-agent:
    image: fiware/iotagent-json:3.14.0
    hostname: json-iot-agent
    ports:
      - "4041:4041"
    environment:
      - IOTA_CB_HOST=orion-ld
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_URI=mongodb://mongo-db:27017/iotagentjson
      - IOTA_HTTP_PORT=7896
      - IOTA_PROVIDER_URL=http://json-iot-agent:4041
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=http://workspace:3000/api/fiware/context-file/context.jsonld
      - IOTA_MQTT_HOST=mqtt-broker
      - IOTA_MQTT_PORT=1883
      - IOTA_AMQP_DISABLED=true
      - IOTA_MQTT_USERNAME=iot-agent
      - IOTA_MQTT_PASSWORD=0123456789
    depends_on:
      - mongo-db
      - mqtt-broker
      - orion-ld

  ##################################################
  # Auth
  ##################################################

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Conexão com o PostgreSQL
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://main-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 123

      # Configurações para funcionar atrás de Proxy HTTPS
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://auth.system.local
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./volumes/keycloak/themes/iot-theme:/opt/keycloak/themes/iot-theme
    depends_on:
      - main-db

volumes:
  mongo_data:
  postgres_data:
  pgadmin_data:
  keycloak_data:
  mosquitto_data:
