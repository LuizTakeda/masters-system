events { worker_connections 1024; }

http {
  proxy_buffer_size   128k;
  proxy_buffers   4 256k;
  proxy_busy_buffers_size   256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
      listen 80;
      server_name app.system.local auth.system.local;
      return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name app.system.local;

    ssl_certificate /etc/nginx/certs/auth.system.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/auth.system.local+1-key.pem;

    location / {
      proxy_pass http://workspace:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    # Server-Sent Events (SSE) streaming endpoint
    location /api/fiware/event {
      proxy_pass http://workspace:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;

      # SSE specific settings: disable buffering, caching and extend timeouts
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      chunked_transfer_encoding on;
    }

    # Block external access to internal NGSI-LD endpoints (e.g. subscription webhooks)
    location /api/ngsi-ld {
      return 403;
    }

    location /api {
      proxy_pass http://workspace:3000; 
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location /ngsi-ld/ {
      proxy_pass http://orion-ld:1026/ngsi-ld/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location /iot/ {
      proxy_pass http://json-iot-agent:4041/iot/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }

  server {
    listen 443 ssl;
    server_name auth.system.local;

    ssl_certificate /etc/nginx/certs/auth.system.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/auth.system.local+1-key.pem;

    location / {
      proxy_pass http://keycloak:8080;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_cache_bypass $http_upgrade;
    }
  }
}

stream {
  upstream mqtt_backend {
    server mqtt-broker:1883;
  }

  server {
    listen 8883 ssl;
    proxy_pass mqtt_backend;

    ssl_certificate /etc/nginx/certs/mqtt-cert.pem;
    ssl_certificate_key /etc/nginx/certs/mqtt-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_MQTT:10m;
    ssl_session_timeout 1d;

    proxy_connect_timeout 5s;
    proxy_timeout 1h;
  }
}